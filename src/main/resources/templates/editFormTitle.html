<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Form Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Edit Form Title</h1>
        <form th:action="@{/forms/{id}/edit-title(id=${form.fId})}" method="post">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" name="title" th:value="${form.title}" required>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/forms}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
