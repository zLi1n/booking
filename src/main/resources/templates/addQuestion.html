<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Question</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-4 mb-3">
        <h1>Add Question</h1>
        <form th:action="@{/questions/add}" th:object="${question}" method="post" class="row g-0">
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label" for="text">Question Text:</label>
                <div class="col-sm-10">
                    <input type="text" th:field="*{text}" id="text" class="form-control" />
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label" for="type">Type:</label>
                <div class="col-sm-10">
                    <select name="type" id="type" th:field="*{type}" class="form-select">
                        <option value="choice">Choice</option>
                        <option value="date">Date</option>
                        <option value="time">Time</option>
                        <option value="text">Text</option>
                        <option value="number">Number</option>
                    </select>
                </div>
            </div>
            <input type="hidden" th:if="${formId != null}" name="formId" th:value="${formId}" />
            <div class="d-grid gap-2 col-2 mx-auto">
                <button type="submit" class="btn btn-success">Save</button>
            </div>
        </form>
    </div>
</body>

</html>
