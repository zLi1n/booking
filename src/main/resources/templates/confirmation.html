<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Booking Confirmation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-4 mb-3">
        <h1>Booking Confirmation</h1>
        <p th:text="'User: ' + ${user.name}">User Name</p>
        <p th:text="'Email: ' + ${user.email}">User Email</p>
        <p th:text="'Telephone: ' + ${user.tel}">User Telephone</p>
        <h2>Bookings:</h2>
        <div th:object="${booking}">
            <p th:text="'Booking ID: ' + *{bId}">Booking ID</p>
            <p th:text="'Date: ' + *{date}">Booking Date</p>
            <p th:text="'Status: ' + *{status}">Booking Status</p>
            <h3>Details:</h3>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Question</th>
                        <th scope="col">Answer</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="detail, detailStat : *{details}">
                        <th scope="row" th:text="${detailStat.count}"></th>
                        <td th:text="${detail.question?.text}">Question</td>
                        <td>
                            <span th:if="${detail instanceof T(com.example.booking.user_answer.UserAnswer)}"
                                th:text="${detail.text}">Answer</span>

                            <span th:if="${detail instanceof T(com.example.booking.user_select.UserSelect)}">
                                <span
                                    th:if="${detail.answer instanceof T(com.example.booking.choice_answer.ChoiceAnswer)}"
                                    th:text="${detail.answer.text}">Answer</span>

                                <span th:if="${detail.answer instanceof T(com.example.booking.date_answer.DateAnswer)}"
                                    th:text="${#dates.format(detail.answer.date, 'yyyy-MM-dd')}">Date</span>

                                <span th:if="${detail.answer instanceof T(com.example.booking.time_answer.TimeSlot)}"
                                    th:text="${#temporals.format(detail.answer.startTime.toLocalTime(), 'h:mm a', #locale.ENGLISH)} + ' - ' + ${#temporals.format(detail.answer.endTime.toLocalTime(), 'h:mm a', #locale.ENGLISH)}">Time
                                    Slot</span>

                                <span
                                    th:if="${detail.answer instanceof T(com.example.booking.number_answer.NumberAnswer)}"
                                    th:text="'Quantity: ' + ${detail.qty}">Quantity</span>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="d-grid col-3 mx-auto">
            <div class="btn-group">
                <a th:href="@{/booking/book(userId=${user.uId})}" class="btn btn-primary">Start New Booking</a>
                <a th:href="@{/booking/main(userId=${user.uId})}" class="btn btn-secondary">Home</a>
            </div>
        </div>
    </div>
</body>

</html>
