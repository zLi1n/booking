<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Booking Confirmation</title>
</head>

<body>
    <h1>Booking Confirmation</h1>
    <p th:text="'User: ' + ${user.name}">User Name</p>
    <p th:text="'Email: ' + ${user.email}">User Email</p>
    <p th:text="'Telephone: ' + ${user.tel}">User Telephone</p>
    <h2>Bookings:</h2>
    <div th:object="${booking}">
        <p th:text="'Booking ID: ' + *{bId}">Booking ID</p>
        <p th:text="'Date: ' + *{date}">Booking Date</p>
        <p th:text="'Status: ' + *{status}">Booking Status</p>
        <h3>Details:</h3>
        <div th:each="detail, detailStat : *{details}">
            <p th:text="'Question text: ' + ${detail.question?.text}">Question</p>
            <p th:if="${detail instanceof T(com.example.booking.user_answer.UserAnswer)}"
                th:text="'Answer text: ' + ${detail.text}">Answer</p>
            <p th:if="${detail instanceof T(com.example.booking.user_select.UserSelect)}">
                <span th:if="${detail.answer instanceof T(com.example.booking.choice_answer.ChoiceAnswer)}"
                    th:text="'Answer text: ' + ${detail.answer.text}">Answer</span>
                <span th:if="${detail.answer instanceof T(com.example.booking.date_answer.DateAnswer)}"
                    th:text="'Date: ' + ${#dates.format(detail.answer.date, 'yyyy-MM-dd')}">Date</span>
                <span th:if="${detail.answer instanceof T(com.example.booking.time_answer.TimeSlot)}"
                    th:text="'Time: ' + ${#temporals.format(detail.answer.startTime.toLocalTime(), 'h:mm a', #locale.ENGLISH)} + ' - ' + ${#temporals.format(detail.answer.endTime.toLocalTime(), 'h:mm a', #locale.ENGLISH)}">Time
                    Slot</span>
                <!--<span th:text="'Quantity: ' + ${detail.qty}">Quantity</span>-->
            </p>
        </div>
    </div>
    <a th:href="@{/booking/book(userId=${user.uId})}">Start New Booking</a>
    <a th:href="@{/booking/main(userId=${user.uId})}">Home</a>
</body>

</html>
