<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Question</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-4 mb-3">
        <h1>Edit Question</h1>
        <form th:action="@{/questions/{id}/edit(id=${question.qId})}" th:object="${question}" method="post"
            class="row g-0">
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label" for="text">Question Text:</label>
                <div class="col-sm-10">
                    <input type="text" id="text" th:field="*{text}" class="form-control" />
                </div>
            </div>

            <div class="d-grid gap-1 col-2 mx-auto">
                <div class="btn-group">
                    <button type="submit" class="btn btn-success"><i class="fa fa-check-circle"></i> Save</button>
                    <a th:href="@{/questions/{id}(id=${question.qId})}" class="btn btn-secondary">Cancel <i
                            class="fa fa-times-circle"></i></a>
                </div>
            </div>
        </form>
    </div>
</body>

</html>
