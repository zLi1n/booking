<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Booking Main Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4 mb-3">
        <h1>Edit Booking Main Page</h1>
        <form th:action="@{/admin/form/{formId}/edit-main-page(formId=${display.form.fId})}" 
      method="post" 
      th:object="${display}"
      enctype="multipart/form-data">
            <input type="hidden" th:field="*{displayId}" />
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" th:field="*{title}" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="3" maxlength="1000"></textarea>
                <small class="text-muted">Maximum 1000 characters</small>
            </div>
            <div class="mb-3">
                <label for="bannerFile" class="form-label">Banner Image</label>
                <input type="file" class="form-control" id="bannerFile" name="bannerFile" accept="image/*">
            </div>
            
            <div th:if="${display.bannerImagePath}" class="mb-3">
                <p>Current banner:</p>
                <img th:src="@{'/uploads/' + ${display.bannerImagePath}}" alt="Current Banner" style="max-width: 200px;">
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/forms}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
