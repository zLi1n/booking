<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Booking Main Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        .banner {
            display: flex;
            align-items: flex-end;
            position: relative;
        }

        .img-fluid {
            width: 100%;
            height: auto;
        }

        .banner-text {
            position: absolute;
        }
    </style>
</head>

<body>
    <div class="container mt-4 mb-3">
        <h1>Edit Booking Main Page</h1>
        <form th:action="@{/admin/form/{formId}/edit-main-page(formId=${display.form.fId})}" method="post" th:object="${display}" enctype="multipart/form-data">
            <input type="hidden" th:field="*{displayId}" />
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" th:field="*{title}" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="3" maxlength="1000"></textarea>
                <small class="text-muted">Maximum 1000 characters</small>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="bannerFile" class="form-label">Banner Image</label>
                    <input type="file" class="form-control" id="bannerFile" name="bannerFile" accept="image/*">
                </div>
                <div class="col-md-6">
                    <div th:if="${display.bannerImagePath}">
                        <p>Current banner:</p>
                        <img th:src="@{'/uploads/' + ${display.bannerImagePath}}" alt="Current Banner" style="max-width: 200px;">
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary me-2">Save</button>
                <a th:href="@{/forms}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
        <h3>Current view:</h3>
    </div>
    <div class="banner">
        <img th:if="${display.bannerImagePath}" th:src="@{'/uploads/' + ${display.bannerImagePath}}" alt="Banner" class="img-fluid mb-3">
        <div class="banner-text ms-5 me-5">
            <h1 th:if="${display.title}" th:text="${display.title}">Booking System</h1>
            <p th:if="${display.description}" th:text="${display.description}"></p>
        </div>
    </div>
</body>

</html>
