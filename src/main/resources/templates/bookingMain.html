<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:if="${display}" th:text="${display.title}">Booking Main</title>
    <title th:unless="${display}">Booking Main</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        .banner {
            display: flex;
            align-items: flex-end;
            position: relative;

        }

        .img-fluid {
            width: 100%;
            height: auto;
        }

        .banner-text {
            position: absolute;
        }
    </style>
</head>

<body>
    <div th:if="${display}" class="banner">
        <img th:if="${display.bannerImagePath}" th:src="@{'/uploads/' + ${display.bannerImagePath}}" alt="Banner"
            class="img-fluid mb-3">
        <div class="banner-text ms-5 me-5">
            <h1 th:if="${display.title}" th:text="${display.title}">Booking System</h1>
            <p th:if="${display.description}" th:text="${display.description}"></p>
        </div>
    </div>
    <div th:unless="${display}" class="container mt-4 mb-3">
        <h1>Booking System</h1>
    </div>
    <div class="container mt-4 mb-3">
        <div class="d-grid gap-1 col-2 mx-auto">
            <div class="btn-group">
                <a th:href="@{/booking/book(userId=${userId}, formId=${formId})}" class="btn btn-primary">Book Now</a>
                <a th:href="@{/booking/history(userId=${userId}, formId=${formId})}" class="btn btn-secondary">View
                    History</a>
            </div>
        </div>
    </div>
</body>

</html>
