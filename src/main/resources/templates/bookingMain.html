<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${display.title}">Booking Main</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-4 mb-3">
        <h1 th:text="${display.title}">Booking System</h1>
        <img th:if="${display.bannerImagePath}" 
     th:src="@{'/uploads/' + ${display.bannerImagePath}}" 
     alt="Banner" class="img-fluid mb-3">
        <p th:text="${display.description}"></p>
        <div class="d-grid gap-1 col-2 mx-auto">
            <div class="btn-group">
                <a th:href="@{/booking/book(userId=${userId}, formId=${formId})}" class="btn btn-primary">Book Now</a>
                <a th:href="@{/booking/history(userId=${userId}, formId=${formId})}" class="btn btn-secondary">View History</a>
            </div>
        </div>
    </div>
</body>

</html>
