<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Question</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <div class="container mt-4 mb-3">
        <h1>Question</h1>
        <p class="lead" th:text="${question.text}">Question text</p>
        <p class="text-danger" th:if="${error}" th:text="${error}"></p>

        <div th:if="${isTextQuestion}">
            <form th:action="@{/booking/answer}" method="post" class="mt-3">
                <div class="mb-3">
                    <textarea name="textAnswer" rows="4" cols="50" class="form-control" required></textarea>
                </div>
                <input type="hidden" name="bookingId" th:value="${bookingId}" />
                <input type="hidden" name="questionId" th:value="${question.qId}" />
                <button type="submit" class="btn btn-primary">Next</button>
            </form>
        </div>
        <div th:if="${!isTextQuestion}">
            <form th:action="@{/booking/answer}" method="post" class="mt-3">
                <div th:if="${question.type == 'choice'}">
                    <div class="mb-3">
                        <div th:each="answer : ${availableAnswers}" class="form-check">
                            <input type="radio" th:id="'answer-' + ${answer.aId}" name="selectedAnswerId"
                                th:value="${answer.aId}" class="form-check-input" required />
                            <label class="form-check-label" th:for="'answer-' + ${answer.aId}"
                                th:text="${answer.text}">Answer text</label>
                            <span th:if="${answer.qty != null}"
                                th:text="'(Available: ' + ${answer.remainingQty != null ? answer.remainingQty : answer.qty} + ')'"></span>
                            <!-- <input th:if="${answer.qty != null}" type="number" name="quantity" min="1"
                                th:max="${answer.remainingQty != null ? answer.remainingQty : answer.qty}" value="1"
                                class="form-control mt-2" />-->
                            <input th:if="${answer.qty != null}" type="hidden" name="quantity" min="1" value="1" />
                        </div>
                    </div>
                </div>

                <div th:if="${question.type == 'date'}" class="mb-3">
                    <label>Date:</label>
                    <div class="input-group">
                        <input type="text" id="datePicker" name="date" class="form-control" placeholder="Select Date..."
                            data-input required />
                        <button class="btn btn-outline-secondary" type="button" title="toggle" data-toggle>
                            <i class="fa fa-calendar"></i>
                        </button>
                        <button class="btn btn-outline-secondary" type="button" title="clear" data-clear>
                            <i class="fa fa-close"></i>
                        </button>
                    </div>
                    <input type="hidden" name="quantity" value="1" />
                    <input type="hidden" name="selectedAnswerId" id="selectedAnswerId" />
                </div>

                <div th:if="${question.type == 'time'}" class="mb-3">
                    <label for="timeSlotSelect">Time Slot:</label>
                    <select id="timeSlotSelect" name="selectedAnswerId" class="form-select" required>
                        <option value="">Select a time slot...</option>
                    </select>
                </div>

                <div th:if="${question.type == 'number'}" class="mb-3">
                    <label for="numberInput">Quantity:</label>
                    <input type="number" id="numberInput" name="quantity" class="form-control" required />
                    <input type="hidden" name="selectedAnswerId" id="numberSelectedAnswerId" />
                </div>

                <input type="hidden" name="bookingId" th:value="${bookingId}" />
                <input type="hidden" name="questionId" th:value="${question.qId}" />
                <button type="submit" class="btn btn-primary">Next</button>
            </form>

            <div th:if="${!isTextQuestion and #lists.isEmpty(availableAnswers)}" class="mt-3 text-danger">
                No available options for this question.
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var availableAnswers = /*[[${serializedAnswers}]]*/[];
        /*]]>*/

        document.addEventListener('DOMContentLoaded', function () {
            var datePicker = document.getElementById('datePicker');
            var timeSlotSelect = document.getElementById('timeSlotSelect');
            var numberInput = document.getElementById('numberInput');
            var numberSelectedAnswerId = document.getElementById('numberSelectedAnswerId');

            if (datePicker) {
                var enabledDates = availableAnswers.map(function (answer) {
                    return answer.date;
                });

                console.log('Enabled Dates:', enabledDates);

                var fp = flatpickr(datePicker, {
                    dateFormat: "Y-m-d",
                    minDate: "today",
                    enable: enabledDates,
                    onChange: function (selectedDates, dateStr, instance) {
                        var selectedAnswer = availableAnswers.find(function (answer) {
                            return answer.date === dateStr;
                        });
                        if (selectedAnswer) {
                            document.getElementById('selectedAnswerId').value = selectedAnswer.aId;
                        }
                    }
                });

                document.querySelector("[data-toggle]").addEventListener("click", function () {
                    fp.toggle();
                });

                document.querySelector("[data-clear]").addEventListener("click", function () {
                    fp.clear();
                });
            }

            if (timeSlotSelect) {
                var timeSlots = availableAnswers.filter(answer => answer.timeRange);
                timeSlots.sort((a, b) => a.timeRange.localeCompare(b.timeRange));

                timeSlots.forEach(function (answer) {
                    var option = document.createElement('option');
                    option.value = answer.aId;
                    option.textContent = answer.timeRange;
                    timeSlotSelect.appendChild(option);
                });

                timeSlotSelect.addEventListener('change', function () {
                    document.getElementById('selectedAnswerId').value = this.value;
                });
            }

            if (numberInput && numberSelectedAnswerId) {
                var numberAnswer = availableAnswers.find(answer => answer.minNum !== undefined && answer.maxNum !== undefined);
                if (numberAnswer) {
                    numberInput.min = numberAnswer.minNum;
                    numberInput.max = numberAnswer.maxNum;
                    numberSelectedAnswerId.value = numberAnswer.aId;
                }
            }
        });
    </script>
</body>

</html>
