<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-4 mb-3">
        <h1>Sign Up</h1>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <p th:text="${errorMessage}"></p>
        </div>

        <form th:action="@{/users/signup}" method="post" th:object="${userSignupDTO}">
            <input type="hidden" name="formId" th:value="${formId}" />
            <div class="row mb-3">
                <label for="name" class="col-sm-2 col-form-label">Name:</label>
                <div class="col-sm-10">
                    <input type="text" id="name" name="name" class="form-control" required />
                </div>
            </div>

            <div class="row mb-3">
                <label for="email" class="col-sm-2 col-form-label">Email:</label>
                <div class="col-sm-10">
                    <input type="email" id="email" name="email" class="form-control" required />
                </div>
            </div>

            <div class="row mb-3">
                <label for="tel" class="col-sm-2 col-form-label">Telephone:</label>
                <div class="col-sm-10">
                    <input type="tel" id="tel" name="tel" class="form-control" required />
                </div>
            </div>

            <div class="row mb-3">
                <label for="password" class="col-sm-2 col-form-label">Password:</label>
                <div class="col-sm-10">
                    <input type="password" id="password" name="password" class="form-control" required />
                </div>
            </div>

            <div class="d-grid gap-1 col-2 mx-auto mt-3">
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </div>
        </form>

        <div class="d-flex justify-content-center mt-2">
            <a href="/users/login">Login</a>
        </div>
    </div>
</body>

</html>
